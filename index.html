<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سجاد بلوچ - SIM Details Lookup</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 35px 25px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h2 {
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(45deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }

    .search-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 5px 15px;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }

    .input-wrapper i {
      color: #818cf8;
      font-size: 18px;
      margin-left: 10px;
    }

    input[type="text"] {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      padding: 12px 5px;
      direction: ltr;
      text-align: left;
    }

    input[type="text"]::placeholder {
      color: #64748b;
      direction: rtl;
      text-align: right;
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6);
    }

    button:active {
      transform: translateY(0);
    }

    .loader {
      display: none;
      text-align: center;
      color: #818cf8;
      font-weight: 600;
      margin: 15px 0;
      font-size: 14px;
    }

    /* Result Row Styling */
    .result-card {
      display: none;
      margin-top: 15px;
      direction: ltr;
      text-align: left;
    }

    .record-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .record-title {
      font-size: 13px;
      font-weight: bold;
      color: #818cf8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
      gap: 15px;
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .data-label {
      color: #38bdf8;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .data-value {
      color: #f1f5f9;
      font-size: 14px;
      font-weight: 500;
      word-break: break-word;
      text-align: right;
    }

    .error {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      display: none;
      margin-top: 15px;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      color: #94a3b8;
    }

    .footer span {
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>سجاد بلوچ - SIM Tracker</h2>
      <p>SIM Details Lookup System</p>
    </div>
    
    <div class="search-box">
      <div class="input-wrapper">
        <i class="fa-solid fa-phone"></i>
        <input type="text" id="phoneInput" placeholder="Enter Mobile or CNIC (e.g. 0300...)" />
      </div>
      <button onclick="fetchSimDetails()">
        <i class="fa-solid fa-magnifying-glass"></i> Search
      </button>
    </div>

    <div class="loader" id="loader">Searching details...</div>
    <div class="error" id="errorMessage"></div>
    <div class="result-card" id="resultBox"></div>

    <div class="footer">
      Designed & Developed by: <span>سجاد بلوچ</span>
    </div>
  </div>

  <script>
    async function fetchSimDetails() {
      const inputVal = document.getElementById('phoneInput').value.trim();
      const resultBox = document.getElementById('resultBox');
      const loader = document.getElementById('loader');
      const errorMsg = document.getElementById('errorMessage');

      // Reset UI
      resultBox.style.display = 'none';
      errorMsg.style.display = 'none';
      resultBox.innerHTML = '';

      if (!inputVal) {
        errorMsg.innerText = 'Please enter a mobile number or CNIC.';
        errorMsg.style.display = 'block';
        return;
      }

      loader.style.display = 'block';

      try {
        const apiUrl = `https://wasifali.biz.id/public_apis/sim-info-api.php?search=${encodeURIComponent(inputVal)}`;
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          throw new Error('Server response error');
        }

        const responseText = await response.text();
        loader.style.display = 'none';

        if (responseText && responseText.trim() !== "") {
          renderCleanRecords(responseText);
        } else {
          errorMsg.innerText = 'No record found.';
          errorMsg.style.display = 'block';
        }

      } catch (error) {
        loader.style.display = 'none';
        errorMsg.innerText = 'Failed to fetch data or CORS blocked by browser.';
        errorMsg.style.display = 'block';
      }
    }

    function renderCleanRecords(responseText) {
      const resultBox = document.getElementById('resultBox');
      const errorMsg = document.getElementById('errorMessage');

      let records = [];

      try {
        // Try parsing JSON response
        const parsedData = JSON.parse(responseText);
        if (parsedData.RECORDS && Array.isArray(parsedData.RECORDS)) {
          records = parsedData.RECORDS;
        } else if (Array.isArray(parsedData)) {
          records = parsedData;
        } else if (typeof parsedData === 'object') {
          records = [parsedData];
        }
      } catch (e) {
        // Fallback for non-JSON text response
        fallbackTextParser(responseText);
        return;
      }

      if (records.length === 0) {
        errorMsg.innerText = 'No record details found.';
        errorMsg.style.display = 'block';
        return;
      }

      let formattedHtml = '';

      records.forEach((rec, index) => {
        formattedHtml += `<div class="record-box">`;
        formattedHtml += `<div class="record-title"><i class="fa-solid fa-address-card"></i> RECORD #${index + 1}</div>`;

        for (const [key, value] of Object.entries(rec)) {
          const upperKey = key.toUpperCase();

          // Skip unwanted system/developer fields
          if (['SUCCESS', 'COUNT', 'DETAILS', 'DEVELOPER', 'STATUS'].includes(upperKey)) {
            continue;
          }

          formattedHtml += `
            <div class="data-row">
              <span class="data-label"><i class="fa-solid fa-circle-dot"></i> ${key}</span>
              <span class="data-value">${value || 'N/A'}</span>
            </div>
          `;
        }

        formattedHtml += `</div>`;
      });

      resultBox.innerHTML = formattedHtml;
      resultBox.style.display = 'block';
    }

    // Fallback if API responds with raw text instead of proper JSON
    function fallbackTextParser(text) {
      const resultBox = document.getElementById('resultBox');
      const lines = text.split('\n').filter(line => line.trim() !== '');

      let formattedHtml = '<div class="record-box">';
      let validCount = 0;

      lines.forEach(line => {
        const lower = line.toLowerCase();

        // Skip unwanted fields
        if (lower.includes('details') || lower.includes('success') || lower.includes('count') || lower.includes('records')) {
          return;
        }

        validCount++;
        if (line.includes(':')) {
          const parts = line.split(':');
          const k = parts[0].replace(/["{}]/g, '').trim();
          const v = parts.slice(1).join(':').replace(/["{},]/g, '').trim();

          formattedHtml += `
            <div class="data-row">
              <span class="data-label"><i class="fa-solid fa-circle-dot"></i> ${k}</span>
              <span class="data-value">${v || 'N/A'}</span>
            </div>
          `;
        }
      });

      formattedHtml += '</div>';

      if (validCount > 0) {
        resultBox.innerHTML = formattedHtml;
        resultBox.style.display = 'block';
      } else {
        document.getElementById('errorMessage').innerText = 'No record details found.';
        document.getElementById('errorMessage').style.display = 'block';
      }
    }
  </script>

</body>
</html>
